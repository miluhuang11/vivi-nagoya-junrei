<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>名古屋・高山・立山黑部 聖地巡禮 8日行程</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗾</text></svg>" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <h1>🗾 名古屋・高山・立山黑部・聖地巡禮</h1>
    <p class="subtitle">2026/08/26 – 2026/09/02　｜　《冰菓》×《你的名字》巡禮行程</p>
  </div>
  <div id="sync-status" class="sync-status">連線中…</div>
</header>

<nav id="day-tabs" class="day-tabs"></nav>

<main id="app" class="app-main">
  <div class="loading" id="loading-msg">行程載入中，請稍候…</div>
</main>

<button id="add-day-btn" class="fab" title="新增一天" hidden>＋ 新增天數</button>

<div id="modal-overlay" class="modal-overlay" hidden>
  <div class="modal">
    <h3 id="modal-title">新增景點</h3>
    <form id="item-form">
      <label>時段標籤 <span class="hint">(例如：上午 / 午餐 / 傍晚 / 宿)</span>
        <input type="text" id="field-period" placeholder="上午" required />
      </label>
      <label>類型
        <select id="field-category">
          <option value="spot">📍 景點</option>
          <option value="food">🍽️ 美食</option>
          <option value="transport">🚃 交通</option>
          <option value="hotel">🏨 住宿</option>
          <option value="note">📝 備註</option>
        </select>
      </label>
      <label>內容
        <textarea id="field-text" rows="4" placeholder="描述這個景點/行程內容…" required></textarea>
      </label>
      <div class="modal-actions">
        <button type="button" id="modal-cancel" class="btn btn-ghost">取消</button>
        <button type="submit" class="btn btn-primary">儲存</button>
      </div>
    </form>
  </div>
</div>

<footer class="app-footer">
  <p>大家可以自由新增／編輯／刪除景點，內容會即時同步給所有人 ✨</p>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
